<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>risim</title>
    <style>
      html {
        height: 100%;
        margin: 0;
      }
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        text-align: center;
        background-color: #1b1b1b;
      }
      #cvs {
          width: auto !important;
          height: 100% !important;
          outline: none;
      }
      #load-overlay {
          flex-direction: column;
          position: absolute;
          top: 0;
          left: 0;
          gap: 10px;
          width: 100%;
          height: 100%;
          z-index: 999;
          background-color: rgba(0, 0, 0, 0.5);
          display: flex;
          justify-content: center;
          align-items: center;
          color: white;
          font-size: 4vw;
      }
      #progress-bar::-webkit-progress-bar {
        background-color: #393939;
        border-radius: 10px;
        overflow: hidden;
      }

      #progress-bar::-webkit-progress-value {
        background-color: #aaa;
        border-radius: 10px;
        transition: width 0.1s ease;
      }

      #progress-bar {
        background-color: #393939;
        border: none;
        border-radius: 10px;
        height: 20px;
        width: 30%;
      }

      #progress-bar::-moz-progress-bar {
        background-color: #aaa;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
      <canvas id="cvs"></canvas>
      <div id="load-overlay">
          <div id="loading-text">Loading...</div>
          <progress id="progress-bar" value="0" max="100"></progress>
      </div>
  </body>
  <script type="module">
    import init from "./pkg/risim.js";

    // init().then(() => {
    //   document.getElementById("load-overlay").remove()
    // }).catch((error) => {
    //   console.error("Failed to init:", error);
    // });
    let progressBar = document.getElementById("progress-bar");
    let xhr = new XMLHttpRequest();
    xhr.open("GET", "./pkg/risim_bg.wasm", true);
    xhr.responseType = "arraybuffer";
    xhr.onprogress = (ev) => {
      console.log(ev.lengthComputable, ev.loaded, ev.total)
      if (ev.lengthComputable) {
        const percent = Math.round((ev.loaded / ev.total) * 100);
        progressBar.value = percent;
      } else {
        progressBar.removeAttribute('value');
      }
    };
    xhr.onload = (ev) => {
      if (xhr.status === 200) {
        const wasmBytes = xhr.response;
        init(wasmBytes).then(() => {
          document.getElementById("load-overlay").remove();
        }).catch((e) => {
          console.error("Failed to load wasm. Cause by: ", e);
          document.getElementById("load-overlay").innerHTML = "<div style='color: red;'>初始化失败</div>";
        })
      } else {
        console.error("Failed to download wasm. Status code: ", xhr.status);
          document.getElementById("load-overlay").innerHTML = "<div style='color: red;'>网络异常</div>";
      }
    }
    xhr.error = () => {
      console.error("Failed to request.");
        document.getElementById("load-overlay").innerHTML = "<div style='color: red;'>网络异常</div>";
    }
    xhr.send();
  </script>
  <script>
    // Insert hack to make sound autoplay on Chrome as soon as the user interacts with the tab:
    // https://developers.google.com/web/updates/2018/11/web-audio-autoplay#moving-forward
    (function () {
      // An array of all contexts to resume on the page
      const audioContextList = [];

      // An array of various user interaction events we should listen for
      const userInputEventNames = [
        "click",
        "contextmenu",
        "auxclick",
        "dblclick",
        "mousedown",
        "mouseup",
        "pointerup",
        "touchend",
        "keydown",
        "keyup",
      ];

      // A proxy object to intercept AudioContexts and
      // add them to the array for tracking and resuming later
      self.AudioContext = new Proxy(self.AudioContext, {
        construct(target, args) {
          const result = new target(...args);
          audioContextList.push(result);
          return result;
        },
      });

      // To resume all AudioContexts being tracked
      function resumeAllContexts(event) {
        let count = 0;

        audioContextList.forEach((context) => {
          if (context.state !== "running") {
            context.resume();
          } else {
            count++;
          }
        });

        // If all the AudioContexts have now resumed then we
        // unbind all the event listeners from the page to prevent
        // unnecessary resume attempts
        if (count == audioContextList.length) {
          userInputEventNames.forEach((eventName) => {
            document.removeEventListener(eventName, resumeAllContexts);
          });
        }
      }

      // We bind the resume function for each user interaction
      // event on the page
      userInputEventNames.forEach((eventName) => {
        document.addEventListener(eventName, resumeAllContexts);
      });
    })();
  </script>
</html>
