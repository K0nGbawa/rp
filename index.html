<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>risim</title>
    <style>
      html {
        height: 100%;
        margin: 0;
      }
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        text-align: center;
        background-color: #1b1b1b;
      }
      #cvs {
          max-width: 100%;
          max-height: 100%;
          width: auto;
          height: auto;
          aspect-ratio: 9 / 16;
          display: block;
          margin: 0 auto;   /* 水平居中 */
          outline: none;
      }
      #load-overlay {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          z-index: 999;
          gap: 10px;
          background-color: rgba(0, 0, 0, 0.5);
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          color: white;
          font-size: 2vw;
      }
      #loading-progress::-webkit-progress-bar {
        background-color: #393939;
        border-radius: 10px;
        overflow: hidden;
      }

      #loading-progress::-webkit-progress-value {
        background-color: #aaa;
        border-radius: 10px;
        transition: width 0.1s ease;
      }

      #loading-progress {
        background-color: #393939;
        border: none;
        border-radius: 5px;
        width: 20%;
        height: 10px;
      }

      #loading-progress::-moz-progress-bar {
        background-color: #aaa;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
      <canvas id="cvs"></canvas>
      <div id="load-overlay">
          <div id="loading-text">Loading...</div>
          <progress id="loading-progress" value="0" max="100"></progress>
      </div>
  </body>
  <script type="module">
    import init from "./pkg/risim.js";

    async function run() {
      const progress = document.getElementById("loading-progress")
      const sizeResp = await fetch("./pkg/size")
      const sizeText = await sizeResp.text()
      const size = parseInt(sizeText.trim())
      const resp = await fetch("./pkg/risim_bg.wasm")
      const reader = resp.body.getReader();
      let receivedLength = 0;
      let chunks = [];

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        receivedLength += value.length;
        progress.value = Math.round(receivedLength / size);
      }

      const allData = new Uint8Array(receivedLength);
      let position = 0;
      for (const chunk of chunks) {
        allData.set(chunk, position);
        position += chunk.length;
      }
      await init(allData);
    }

    run().then(() => {
      document.getElementById("load-overlay").remove()
    }).catch((error) => {
      console.error("Failed to init:", error);
    });
  </script>
  <script>
    // Insert hack to make sound autoplay on Chrome as soon as the user interacts with the tab:
    // https://developers.google.com/web/updates/2018/11/web-audio-autoplay#moving-forward
    (function () {
      // An array of all contexts to resume on the page
      const audioContextList = [];

      // An array of various user interaction events we should listen for
      const userInputEventNames = [
        "click",
        "contextmenu",
        "auxclick",
        "dblclick",
        "mousedown",
        "mouseup",
        "pointerup",
        "touchend",
        "keydown",
        "keyup",
      ];

      // A proxy object to intercept AudioContexts and
      // add them to the array for tracking and resuming later
      self.AudioContext = new Proxy(self.AudioContext, {
        construct(target, args) {
          const result = new target(...args);
          audioContextList.push(result);
          return result;
        },
      });

      // To resume all AudioContexts being tracked
      function resumeAllContexts(event) {
        let count = 0;

        audioContextList.forEach((context) => {
          if (context.state !== "running") {
            context.resume();
          } else {
            count++;
          }
        });

        // If all the AudioContexts have now resumed then we
        // unbind all the event listeners from the page to prevent
        // unnecessary resume attempts
        if (count == audioContextList.length) {
          userInputEventNames.forEach((eventName) => {
            document.removeEventListener(eventName, resumeAllContexts);
          });
        }
      }

      // We bind the resume function for each user interaction
      // event on the page
      userInputEventNames.forEach((eventName) => {
        document.addEventListener(eventName, resumeAllContexts);
      });
    })();
  </script>
</html>
