<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>risim</title>
    <style>
      html {
        height: 100%;
        margin: 0;
      }
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        text-align: center;
        background-color: #1b1b1b;
      }
      #cvs {
          width: auto !important;
          height: 100% !important;
          outline: none;
      }
      #load-overlay {
          flex-direction: column;
          position: absolute;
          top: 0;
          left: 0;
          gap: 10px;
          width: 100%;
          height: 100%;
          z-index: 999;
          background-color: rgba(0, 0, 0, 0.5);
          display: flex;
          justify-content: center;
          align-items: center;
          color: white;
          font-size: 4vw;
      }
      #progress-bar::-webkit-progress-bar {
        background-color: #393939;
        border-radius: 10px;
        overflow: hidden;
      }

      #progress-bar::-webkit-progress-value {
        background-color: #aaa;
        border-radius: 10px;
        transition: width 0.1s ease;
      }

      #progress-bar {
        background-color: #393939;
        border: none;
        border-radius: 10px;
        height: 20px;
        width: 30%;
      }

      #progress-bar::-moz-progress-bar {
        background-color: #aaa;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
      <canvas id="cvs"></canvas>
      <div id="load-overlay">
          <div id="loading-text">Loading...</div>
          <progress id="progress-bar" value="0" max="100"></progress>
      </div>
  </body>
  <script type="module">
    import init from "./pkg/risim.js";

    // init().then(() => {
    //   document.getElementById("load-overlay").remove()
    // }).catch((error) => {
    //   console.error("Failed to init:", error);
    // });
    let progressBar = document.getElementById("progress-bar");
    // from: https://qwertyyb.github.io/%E5%89%8D%E7%AB%AF%E8%8E%B7%E5%8F%96%E4%B8%8B%E8%BD%BD%E8%BF%9B%E5%BA%A6%E2%80%94%E2%80%94%E4%BB%8E%E5%85%A5%E9%97%A8%E5%88%B0%E6%94%BE%E5%BC%83.html
    const downloadWithProgress = async (url, onUpdate) => {
      const response = await fetch(url)
      const total = +response.headers.get('Content-Length')
      const result = []
      let progress = 0
      const reader = response.body.getReader()
      while(true) {
        const { done, value } = await reader.read()
        if (done) {
          break;
        }
        result.push(value)
        progress += value.length
        onUpdate && onUpdate(progress, total)
      }

      let data = new Uint8Array(progress)

      let position = 0
      result.forEach(item => {
        data.set(item, position)
        position += item.length
      })

      return data
    }
    async function run() {
      const buf = await downloadWithProgress("./pkg/risim_bg.wasm", (progress, total) => {
        progressBar.value = Math.round(progress / total);
      });
      await init(buf);
    }
    
    run().then(() => {
      document.getElementById("load-overlay").remove()
    }).catch((error) => {
      console.error("Failed to init:", error);
      document.getElementById("load-overlay").innerHTML = "<div style='color: red;'>初始化失败，请刷新页面重试</div>"
    });
  </script>
  <script>
    // Insert hack to make sound autoplay on Chrome as soon as the user interacts with the tab:
    // https://developers.google.com/web/updates/2018/11/web-audio-autoplay#moving-forward
    (function () {
      // An array of all contexts to resume on the page
      const audioContextList = [];

      // An array of various user interaction events we should listen for
      const userInputEventNames = [
        "click",
        "contextmenu",
        "auxclick",
        "dblclick",
        "mousedown",
        "mouseup",
        "pointerup",
        "touchend",
        "keydown",
        "keyup",
      ];

      // A proxy object to intercept AudioContexts and
      // add them to the array for tracking and resuming later
      self.AudioContext = new Proxy(self.AudioContext, {
        construct(target, args) {
          const result = new target(...args);
          audioContextList.push(result);
          return result;
        },
      });

      // To resume all AudioContexts being tracked
      function resumeAllContexts(event) {
        let count = 0;

        audioContextList.forEach((context) => {
          if (context.state !== "running") {
            context.resume();
          } else {
            count++;
          }
        });

        // If all the AudioContexts have now resumed then we
        // unbind all the event listeners from the page to prevent
        // unnecessary resume attempts
        if (count == audioContextList.length) {
          userInputEventNames.forEach((eventName) => {
            document.removeEventListener(eventName, resumeAllContexts);
          });
        }
      }

      // We bind the resume function for each user interaction
      // event on the page
      userInputEventNames.forEach((eventName) => {
        document.addEventListener(eventName, resumeAllContexts);
      });
    })();
  </script>
</html>
